<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/header :: head('Detalle del libro')}"></head>

<body>

<div th:replace="~{fragments/header :: nav}"></div>

<div class="container">

    <div th:if="${libro == null}" class="alert alert-danger">
        Libro no encontrado.
    </div>

    <div th:if="${libro != null}" class="card">
        <div class="card-body">

            <h2 th:text="${libro.titulo}">Título</h2>

            <h5 class="text-muted" th:text="${libro.autor}">Autor</h5>

            <p>
                <strong>ISBN:</strong>
                <span th:text="${libro.isbn}"></span>
            </p>

            <p>
                <strong>Categoría:</strong>
                <span th:text="${libro.categoria}"></span>
            </p>

            <p>
                <strong>Disponibilidad:</strong>
                <span th:text="${libro.copiasDisponibles} + ' de ' + ${libro.copiasTotales}"></span>
            </p>

            <!-- Solo para bibliotecarios -->
            <div sec:authorize="hasRole('BIBLIOTECARIO')" class="mb-3">

                <a th:href="@{/prestamos/nuevo}"
                   class="btn btn-primary">
                    Prestar este libro
                </a>

            </div>

            <a href="/libros" class="btn btn-secondary">
                Volver al catálogo
            </a>

        </div>
    </div>

</div>

</body>
</html>
