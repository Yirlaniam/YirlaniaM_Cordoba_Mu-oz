<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/header :: head('Préstamos')}"></head>

<body>

<div th:replace="~{fragments/header :: nav}"></div>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Préstamos registrados</h2>

        <a th:href="@{/prestamos/nuevo}"
           class="btn btn-primary"
           sec:authorize="hasRole('BIBLIOTECARIO')">
            Nuevo préstamo
        </a>
    </div>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Libro</th>
            <th>Usuario</th>
            <th>Fecha préstamo</th>
            <th>Fecha límite</th>
            <th>Fecha devolución</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="prestamo : ${prestamos}">

            <td th:text="${prestamo.id}"></td>

            <td th:text="${prestamo.libro.titulo}"></td>

            <td th:text="${prestamo.usuario.nombreCompleto}"></td>

            <td th:text="${prestamo.fechaPrestamo}"></td>

            <td th:text="${prestamo.fechaLimite}"></td>

            <td>
                <span th:if="${prestamo.fechaDevolucion != null}"
                      th:text="${prestamo.fechaDevolucion}">
                </span>

                <span th:if="${prestamo.fechaDevolucion == null}"
                      class="text-danger">
                    Pendiente
                </span>
            </td>

            <td>

                <a th:if="${prestamo.fechaDevolucion == null}"
                   th:href="@{'/prestamos/devolver/' + ${prestamo.id}}"
                   class="btn btn-success btn-sm"
                   sec:authorize="hasRole('BIBLIOTECARIO')">
                    Devolver
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
