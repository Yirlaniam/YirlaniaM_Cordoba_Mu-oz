<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto</title>
</head>
<body>

<h2>Nuevo Producto</h2>

<form th:action="@{/productos}" th:object="${producto}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div>
        <label>Nombre:</label><br>
        <input type="text" th:field="*{nombre}" />
        <div th:errors="*{nombre}" style="color:red"></div>
    </div>

    <br>

    <div>
        <label>Descripción:</label><br>
        <textarea th:field="*{descripcion}"></textarea>
        <div th:errors="*{descripcion}" style="color:red"></div>
    </div>

    <br>

    <div>
        <label>Precio:</label><br>
        <input type="number" step="0.01" th:field="*{precio}" />
        <div th:errors="*{precio}" style="color:red"></div>
    </div>

    <br>

    <div>
        <label>Stock:</label><br>
        <input type="number" th:field="*{stock}" />
        <div th:errors="*{stock}" style="color:red"></div>
    </div>

    <br>

    <div>
        <label>Categoría:</label><br>
        <input type="text" th:field="*{categoria}" />
        <div th:errors="*{categoria}" style="color:red"></div>
    </div>

    <br>

    <button type="submit">Guardar</button>
    <a th:href="@{/productos}">Cancelar</a>

</form>

</body>
</html>
